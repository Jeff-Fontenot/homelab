http:
  routers:
    jellyfin:
      rule: "Host(`jellyfin.dash.itodyssey.io`)"
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
      service: jellyfin

    proxmox:
      rule: "Host(`proxmox.dash.itodyssey.io`)"
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
      service: proxmox

    headlamp:
      rule: "Host(`headlamp.dash.itodyssey.io`)"
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
      service: headlamp

    ripper:
      rule: "Host(`rip.dash.itodyssey.io`)"
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
      service: ripper

  services:
    jellyfin:
      loadBalancer:
        servers:
          - url: "http://192.168.0.10:8096"

    proxmox:
      loadBalancer:
        servers:
          - url: "https://192.168.0.17:8006"
        serversTransport: proxmox-transport

    headlamp:
      loadBalancer:
        servers:
          - url: "http://192.168.0.13:80"

    ripper:
      loadBalancer:
        servers:
          - url: "http://192.168.0.25:8080"

  serversTransports:
    proxmox-transport:
      insecureSkipVerify: true
