groups:
  - name: portfolio
    interval: 30s
    rules:
      # Proxmox hypervisor host (not the Services VM) -- via pve-exporter,
      # reading the PVE node's own CPU/memory/rootfs status.
      - record: portfolio:host_cpu_usage_percent
        expr: 100 * avg(pve_cpu_usage_ratio{id="node/proxmox"})

      - record: portfolio:host_memory_usage_percent
        expr: 100 * sum(pve_memory_usage_bytes{id="node/proxmox"}) / sum(pve_memory_size_bytes{id="node/proxmox"})

      - record: portfolio:host_disk_usage_percent
        expr: 100 * sum(pve_disk_usage_bytes{id="node/proxmox"}) / sum(pve_disk_size_bytes{id="node/proxmox"})

      - record: portfolio:running_containers
        expr: count(container_last_seen{job="cadvisor", image!=""})

      - record: portfolio:healthy_scrape_targets
        expr: sum(up)

      - record: portfolio:configured_scrape_targets
        expr: count(up)

      - record: portfolio:scrape_health_percent
        expr: 100 * sum(up) / count(up)

      
      # Sanitized Kubernetes aggregates for the public portfolio.
      # All identifying node, namespace, pod, UID, and IP labels are removed.
      - record: portfolio:k8s_nodes_total
        expr: count(kube_node_info{job="kubernetes-state"})

      - record: portfolio:k8s_nodes_ready
        expr: sum(kube_node_status_condition{job="kubernetes-state", condition="Ready", status="true"})

      - record: portfolio:k8s_workload_pods_running
        expr: sum(kube_pod_status_phase{job="kubernetes-state", phase="Running", namespace!~"kube-system|kube-public|kube-node-lease|observability"})

      - record: portfolio:k8s_managed_namespaces
        expr: sum(kube_namespace_status_phase{job="kubernetes-state", phase="Active", namespace!~"kube-system|kube-public|kube-node-lease"})

      - record: portfolio:k8s_scrape_healthy
        expr: max(up{job="kubernetes-state"})
